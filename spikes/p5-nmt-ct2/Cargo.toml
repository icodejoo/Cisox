[package]
name = "p5-nmt-ct2"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
ct2rs = { version = "=0.10.1", default-features = false, features = ["ruy", "sentencepiece"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 3
