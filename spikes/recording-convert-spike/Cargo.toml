# 录屏 BGRA->NV12 转换方案对比 spike：独立 workspace，不加入主工作区。
# 构建：spikes/recording-convert-spike/build.ps1（静态 CRT + 静态 FFmpeg，同 snow-recorder）。
[workspace]

[package]
name = "recording-convert-spike"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
build = "build.rs"

[dependencies]
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Security",
] }

[profile.release]
opt-level = 3
codegen-units = 16
lto = "thin"
debug = 0
incremental = false
