# 表格结构识别工作进程：独立 workspace，只做「一次 ORT 推理」，按需拉起、跑完即退出（不常驻）。
[workspace]
resolver = "3"

[package]
name = "snow-table"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.97"

[[bin]]
name = "snow-table"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "api-28", "load-dynamic"] }

# 与 snow-translator 保持同一 ort 补丁，wrapper 与 sys 必须同 rev。
[patch.crates-io]
ort = { git = "https://github.com/mg-chao/ort.git", rev = "90018ee581fb1bb1baf8e82eba8e679728ff27dc" }
ort-sys = { git = "https://github.com/mg-chao/ort.git", rev = "90018ee581fb1bb1baf8e82eba8e679728ff27dc" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = 3
codegen-units = 16
lto = "thin"
panic = "unwind"
debug = 0
incremental = false
