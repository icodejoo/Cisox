# DISPLAY2 专用帧率夹具：独立 workspace（自己的 target），只依赖已在 snow-recorder 依赖树里的 windows 0.62.2。
[workspace]
resolver = "3"

[package]
name = "snow-fps-fixture"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.97"

[[bin]]
name = "snow-fps-fixture"
path = "src/main.rs"

[dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = 3
debug = 0

[lib]
name = "snow_fps_fixture"
path = "src/lib.rs"
