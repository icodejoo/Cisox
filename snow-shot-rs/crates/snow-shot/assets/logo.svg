<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <title>Cisox 标志</title>
  <defs>
    <!-- 与底板同形的圆角裁剪，叶片超出容器的部分在此裁掉 -->
    <clipPath id="container">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <!-- 圆角底板 -->
  <rect width="512" height="512" rx="112" fill="#12151a"/>

  <!-- 六片叶：仿莲花式扇形，位于准心与外环之后；根部尖端汇聚点从容器中心下移 2 个 1/4 环半径（185 / 4 × 2 = 92.5），即 (256, 348.5)；
       单片叶为统一的柳叶形（长 100，宽约 34，略不对称以带弧度），按各自的长度/角度缩放旋转；
       左侧叶片水平翻转，使弧度朝外；整体半透明，叠加处自然混色 -->
  <g clip-path="url(#container)" fill-opacity="0.85">
    <!-- 左端：绿 -->
    <path transform="translate(256 348.5) rotate(-80) scale(-1.953 1.866)" d="M0,0 C22,-16 25,-64 0,-100 C-20,-62 -24,-20 0,0 Z" fill="#5fae3a"/>
    <!-- 黄绿 -->
    <path transform="translate(256 348.5) rotate(-62) scale(-2.376 2.265)" d="M0,0 C22,-16 25,-64 0,-100 C-20,-62 -24,-20 0,0 Z" fill="#c6d82f"/>
    <!-- 琥珀 -->
    <path transform="translate(256 348.5) rotate(-35) scale(-2.508 2.397)" d="M0,0 C22,-16 25,-64 0,-100 C-20,-62 -24,-20 0,0 Z" fill="#fbb216"/>
    <!-- 右侧：紫 -->
    <path transform="translate(256 348.5) rotate(30) scale(3.351 3.198)" d="M0,0 C22,-16 25,-64 0,-100 C-20,-62 -24,-20 0,0 Z" fill="#7d2c9d"/>
    <!-- 右端：蓝（最长） -->
    <path transform="translate(256 348.5) rotate(80) scale(2.61 2.477)" d="M0,0 C22,-16 25,-64 0,-100 C-20,-62 -24,-20 0,0 Z" fill="#1b92d9"/>
    <!-- 中：红橙，叶片中最上层 -->
    <path transform="translate(256 348.5) rotate(-5) scale(-3.219 3.063)" d="M0,0 C22,-16 25,-64 0,-100 C-20,-62 -24,-20 0,0 Z" fill="#f15a24"/>
  </g>

  <!-- 底部尺子：抽象的测量工具；仅保留白色刻度，共 19 道（每 3 道一长刻度，首、中、尾均为长刻度），左右对称于 x = 256 -->
  <g transform="translate(256 420) scale(1.44) translate(-256 -420)" stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <line x1="112" y1="420" x2="112" y2="442"/>
    <line x1="128" y1="420" x2="128" y2="432"/>
    <line x1="144" y1="420" x2="144" y2="432"/>
    <line x1="160" y1="420" x2="160" y2="442"/>
    <line x1="176" y1="420" x2="176" y2="432"/>
    <line x1="192" y1="420" x2="192" y2="432"/>
    <line x1="208" y1="420" x2="208" y2="442"/>
    <line x1="224" y1="420" x2="224" y2="432"/>
    <line x1="240" y1="420" x2="240" y2="432"/>
    <line x1="256" y1="420" x2="256" y2="442"/>
    <line x1="272" y1="420" x2="272" y2="432"/>
    <line x1="288" y1="420" x2="288" y2="432"/>
    <line x1="304" y1="420" x2="304" y2="442"/>
    <line x1="320" y1="420" x2="320" y2="432"/>
    <line x1="336" y1="420" x2="336" y2="432"/>
    <line x1="352" y1="420" x2="352" y2="442"/>
    <line x1="368" y1="420" x2="368" y2="432"/>
    <line x1="384" y1="420" x2="384" y2="432"/>
    <line x1="400" y1="420" x2="400" y2="442"/>
  </g>

  <!-- 准星外环：截屏取景；线宽 40，外直径仍为容器的 4/5（512 × 0.8 = 410），中心线半径 = 410/2 - 20 = 185 -->
  <circle display="none" cx="256" cy="256" r="185" fill="none" stroke="#3fd3c1" stroke-width="40"/>

  <!-- 十字准心：臂长缩短 1/4 环半径（≈ 46），即内端从距圆心 75 外移到 121，外端仍延伸到容器边缘（圆头端点内缩 20，圆头正好触及边缘）；线宽 40 -->
  <g display="none" stroke="#3fd3c1" stroke-width="40" stroke-linecap="round">
    <line x1="256" y1="20" x2="256" y2="135"/>
    <line x1="256" y1="377" x2="256" y2="492"/>
    <line x1="20" y1="256" x2="135" y2="256"/>
    <line x1="377" y1="256" x2="492" y2="256"/>
  </g>

  <!-- 角标：标注/录制等附加功能 -->
  <circle cx="390" cy="122" r="16" fill="#ffb020"/>
</svg>
