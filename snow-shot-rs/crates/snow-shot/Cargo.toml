[package]
name = "snow-shot"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
snow-app-core = { path = "../snow-app-core" }
snow-canvas-filters = { path = "../snow-canvas-filters" }
snow-canvas-raster = { path = "../snow-canvas-raster" }
snow-canvas-text = { path = "../snow-canvas-text" }
snow-capability = { path = "../snow-capability" }
snow-config = { path = "../snow-config" }
snow-i18n = { path = "../snow-i18n" }
# 标注引擎内核（仓库内 path 依赖，仅依赖 serde，不引入新外部 crate）
snow-draw-engine = { path = "../../../snow_draw_engine_qt/crates/snow-draw-engine" }
snow-draw-engine-editor = { path = "../../../snow_draw_engine_qt/crates/snow-draw-engine-editor" }
# 自动滤镜区域记录类型（仓库内 path 依赖，引擎已带入，Cargo.lock 无新第三方包）
snow-draw-engine-document = { path = "../../../snow_draw_engine_qt/crates/snow-draw-engine-document" }
snow-history = { path = "../snow-history" }
snow-mcp = { path = "../snow-mcp" }
snow-ocr-protocol = { path = "../snow-ocr-protocol" }
snow-net = { path = "../snow-net" }
snow-platform = { path = "../snow-platform" }
snow-recorder-protocol = { path = "../snow-recorder-protocol" }
snow-stt-protocol = { path = "../snow-stt-protocol" }
snow-translate = { path = "../snow-translate" }
snow-update = { path = "../snow-update" }
# 滚动截图拼接（主仓库 Apache-2.0 库；必须关默认特性，否则会拉入 avif/tiff/webp 等编解码）
snow-stitch-images = { path = "../../../snow-crates/crates/snow-stitch-images", default-features = false }
snow-ui = { path = "../snow-ui" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
rqrr = { version = "0.11.0", default-features = false }

# 窗口级智能选区（Apache-2.0；仅 Windows，传递 rstar / crossbeam-channel）
[target.'cfg(windows)'.dependencies]
snow-ui-selector = { path = "../../../snow-crates/crates/snow-ui-selector" }
# 区域检测（仓库内 path 依赖，默认纯 Rust 后端，不启用 opencv）
visual-region-detector = { path = "../../../snow-crates/crates/visual-region-detector" }
snow-selected-text = { path = "../../../snow-crates/crates/snow-selected-text" }

# 构建期嵌入 exe 图标与版本资源（仅 Windows 目标用到，不进运行时）
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
