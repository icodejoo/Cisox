[package]
name = "snow-ui-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# GPUI 与组件库：全仓库唯一允许声明的位置（ADR-1）；版本由 vendor 锁定
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui-kit = "=0.7.0"
# 命令总线与平台能力表：热键/托盘事件以 AppCommand 为出口
snow-app-core = { path = "../../snow-app-core" }
snow-capability = { path = "../../snow-capability" }
# 日志（与 snow-app-core 同族）
tracing = "0.1"

# 从 GPUI 窗口取 HWND（与 gpui 同版本 0.6，锁文件已有）
raw-window-handle = "0.6"

# 与 gpui 使用的 windows 绑定同版本（0.62），避免重复编译
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
# 托盘 / 全局热键（P0 V4 已批准）；muda 经 tray_icon::menu 重导出使用，不单独声明
tray-icon = "0.25.1"
global-hotkey = "0.8.0"
