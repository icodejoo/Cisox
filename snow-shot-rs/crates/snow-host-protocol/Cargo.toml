[package]
name = "snow-host-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "托盘宿主与 UI 进程之间的协议：host/spec.json 快照、会话消息、JSON 行编解码、序号与退出握手"

[lints]
workspace = true

# 宿主进程的依赖闭包受 workspace-guard 约束：只允许 serde 与 serde_json，不得再加别的
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
